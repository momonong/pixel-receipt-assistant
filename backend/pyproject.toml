[project]
name = "pixelreceipt-backend"
version = "0.3.0"
description = "Central evidence, human review and deterministic receipt ledger"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pillow>=11,<13",
  "pypdf>=6,<7",
]

[project.scripts]
pixelreceipt-backend = "pixelreceipt_backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
