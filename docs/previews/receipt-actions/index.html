  <script>
    (() => {
      const root = document.getElementById('pixelreceipt-receipt-preview');
      const screen = root.querySelector('#pr-screen');
      const dialog = root.querySelector('#pr-dialog');
      const receipts = [
        { id: 'daily', merchant: '日用小舖', date: '10/24', items: [{ name: '收納用品', minor: 10000 }, { name: '清潔用品', minor: 16000 }] },
        { id: 'breakfast', merchant: '巷口早餐', date: '10/24', items: [{ name: '蛋餅', minor: 6000 }, { name: '豆漿', minor: 3500 }] },
        { id: 'tea', merchant: '手作茶飲', date: '10/23', items: [{ name: '紅茶', minor: 4500 }] }
      ];
      const receiptById = Object.fromEntries(receipts.map(receipt => [receipt.id, receipt]));
      const defaults = () => ({ version: 1, tab: 'inbox', detailId: null, showVoided: false, statuses: { daily: 'draft', breakfast: 'confirmed', tea: 'confirmed' }, reasons: {} });
      const reasons = ['未註明', '重複記帳', '誤入帳', '其他'];
      let feedback = '';
      let modalReceiptId = null;
      let modalTrigger = null;
      let modalMode = null;
      const money = minor => 'NT$' + (minor / 100).toLocaleString('zh-TW', { maximumFractionDigits: 0 });
      const total = receipt => receipt.items.reduce((sum, item) => sum + item.minor, 0);
      const restore = snapshot => {
        const next = defaults();
        const saved = snapshot?.privateContent?.pixelReceipt;
        if (!saved || saved.version !== 1) return next;
        if (['inbox', 'ledger', 'help'].includes(saved.tab)) next.tab = saved.tab;
        next.showVoided = saved.showVoided === true;
        for (const receipt of receipts) {
          const allowed = receipt.id === 'daily' ? ['draft', 'deleted', 'confirmed', 'voided'] : ['confirmed', 'voided'];
          if (allowed.includes(saved.statuses?.[receipt.id])) next.statuses[receipt.id] = saved.statuses[receipt.id];
          if (reasons.includes(saved.reasons?.[receipt.id])) next.reasons[receipt.id] = saved.reasons[receipt.id];
        }
        if (receiptById[saved.detailId] && next.statuses[saved.detailId] !== 'deleted' && next.tab !== 'help') next.detailId = saved.detailId;
        return next;
      };
      let state = restore(window.openai?.widgetState);
      const activeTotal = () => receipts.filter(receipt => state.statuses[receipt.id] === 'confirmed').reduce((sum, receipt) => sum + total(receipt), 0);
      const persist = () => {
        if (typeof window.openai?.setWidgetState !== 'function') return;
        window.openai.setWidgetState({
          modelContent: { prototype: 'PixelReceipt 介面預覽', view: state.detailId ? '收據明細' : ({ inbox: '收件匣', ledger: '帳本', help: '使用說明' })[state.tab], activeExpenseTwd: activeTotal() / 100, sampleStatuses: { ...state.statuses } },
          privateContent: { pixelReceipt: { ...state, statuses: { ...state.statuses }, reasons: { ...state.reasons } } }
        }).catch(() => {});
      };
      const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
      const refreshIcons = () => { if (globalThis.lucide?.createIcons) lucide.createIcons({ attrs: { width: 22, height: 22 } }); };
      const statusLabel = id => ({ draft: '未入帳', confirmed: state.tab === 'inbox' ? '已完成' : '已入帳', voided: '已作廢' })[state.statuses[id]];
      const row = receipt => {
        const status = state.statuses[receipt.id];
        return `<article class="pr-receipt ${status === 'voided' ? 'pr-voided' : ''}" data-receipt="${receipt.id}">
          <button type="button" class="pr-open cursor-interaction" data-open="${receipt.id}" aria-label="查看${receipt.merchant}，${money(total(receipt))}，${statusLabel(receipt.id)}"><span><span class="pr-row-name">${receipt.merchant}</span><span class="pr-row-meta">${receipt.date} · ${statusLabel(receipt.id)}</span></span><span class="pr-row-amount pr-num">${money(total(receipt))}</span></button>
          ${status !== 'voided' ? `<button type="button" class="pr-icon-button cursor-interaction" data-menu="${receipt.id}" aria-label="${receipt.merchant}的更多操作" aria-haspopup="dialog">${icon('ellipsis-vertical')}</button>` : ''}
        </article>`;
      };
      const feedbackMarkup = () => feedback ? `<p class="pr-feedback" role="status">${feedback}</p>` : '';
      const header = (name, subtitle) => `<p class="pr-brand">PixelReceipt</p><h1>${name}</h1><p class="pr-subtitle">${subtitle}</p>`;
      function render() {
        root.querySelectorAll('[data-nav]').forEach(button => {
          if (button.dataset.nav === state.tab) button.setAttribute('aria-current', 'page');
          else button.removeAttribute('aria-current');
        });
        if (state.detailId) {
          renderDetail(receiptById[state.detailId]);
        } else if (state.tab === 'inbox') {
          const visible = receipts.filter(receipt => state.statuses[receipt.id] !== 'deleted');
          const pending = visible.filter(receipt => state.statuses[receipt.id] === 'draft');
          const completed = visible.filter(receipt => state.statuses[receipt.id] === 'confirmed');
          const voided = visible.filter(receipt => state.statuses[receipt.id] === 'voided');
          const summary = `待核對 ${pending.length} 張 · 已完成 ${completed.length} 張${voided.length ? ` · 已作廢 ${voided.length} 張` : ''}`;
          screen.innerHTML = header('收件匣', summary) + feedbackMarkup() + `<div class="pr-list">${visible.length ? visible.map(row).join('') : '<p class="pr-empty">沒有收據。</p>'}</div><p class="pr-note">未入帳的收據不會計入支出。</p>`;
        } else if (state.tab === 'ledger') {
          const active = receipts.filter(receipt => state.statuses[receipt.id] === 'confirmed');
          const voided = receipts.filter(receipt => state.statuses[receipt.id] === 'voided');
          const visible = receipts.filter(receipt => state.statuses[receipt.id] === 'confirmed' || (state.showVoided && state.statuses[receipt.id] === 'voided'));
          screen.innerHTML = header('帳本', `有效帳目 ${active.length} 筆`) + feedbackMarkup() + `<div class="pr-ledger-total"><span>目前支出</span><strong class="pr-num" data-total>${money(activeTotal())}</strong></div><div class="pr-list">${visible.length ? visible.map(row).join('') : '<p class="pr-empty">沒有有效帳目。</p>'}</div><label class="pr-filter cursor-interaction"><input type="checkbox" id="pr-show-voided" ${state.showVoided ? 'checked' : ''}>查看已作廢（${voided.length} 筆）</label>`;
        } else {
          screen.innerHTML = header('使用說明', '收據整理與帳目管理') + `<div class="pr-panel pr-help"><section><h2>先確認，再入帳</h2><p>在收件匣打開收據，檢查品項與金額後，按「確認入帳」。已完成的收據仍會留在收件匣。</p></section><section><h2>刪除未入帳收據</h2><p>從收據右側「更多操作」選擇「刪除收據」。未入帳收據不影響帳本支出。</p></section><section><h2>作廢已入帳帳目</h2><p>在帳本的「更多操作」選擇「作廢帳目」。歷史紀錄會保留，金額不再計入支出。</p></section></div>`;
        }
        refreshIcons();
      }
      function renderDetail(receipt) {
        const status = state.statuses[receipt.id];
        const backLabel = state.tab === 'inbox' ? '收件匣' : '帳本';
        screen.innerHTML = `<div class="pr-topline"><button type="button" class="pr-back cursor-interaction" data-back>${icon('arrow-left')}<span>${backLabel}</span></button>${status !== 'voided' ? `<button type="button" class="pr-icon-button cursor-interaction" data-menu="${receipt.id}" aria-label="${receipt.merchant}的更多操作" aria-haspopup="dialog">${icon('ellipsis-vertical')}</button>` : ''}</div>
          <div class="pr-detail-header"><div><h1>${receipt.merchant}</h1><span class="pr-status">${receipt.date} · ${statusLabel(receipt.id)}</span></div><p class="pr-detail-amount pr-num">${money(total(receipt))}</p></div>
          <section class="pr-panel" aria-label="收據品項"><h2>品項明細</h2><ul class="pr-items">${receipt.items.map(item => `<li><div class="pr-item-line"><span>${item.name}</span><span class="pr-num">${money(item.minor)}</span></div><p class="pr-item-purpose">自己用</p></li>`).join('')}</ul><div class="pr-total-line"><span>合計</span><span class="pr-num">${money(total(receipt))}</span></div></section>
          ${status === 'draft' ? `<p class="pr-note">確認後，${money(total(receipt))} 會計入帳本支出。</p><button type="button" class="pr-primary cursor-interaction" data-post="${receipt.id}">確認入帳</button>` : status === 'voided' ? `<p class="pr-note">作廢原因：${state.reasons[receipt.id] || '未註明'}<br>保留歷史紀錄，不計入支出。</p>` : '<p class="pr-note">這筆帳目已計入支出。</p>'}`;
      }
      function openMenu(id, trigger) {
        modalReceiptId = id;
        modalTrigger = trigger;
        modalMode = 'menu';
        renderDialog();
        dialog.showModal();
      }
      function renderDialog() {
        const receipt = receiptById[modalReceiptId];
        const draft = state.statuses[receipt.id] === 'draft';
        const action = draft ? '刪除收據' : '作廢帳目';
        if (modalMode === 'menu') {
          dialog.innerHTML = `<h2 id="pr-dialog-title">${receipt.merchant}</h2><p class="pr-dialog-effect pr-num">${money(total(receipt))} · ${statusLabel(receipt.id)}</p><button type="button" class="pr-sheet-action cursor-interaction" data-destructive>${icon(draft ? 'trash-2' : 'circle-slash')}<span>${action}</span></button><div class="pr-dialog-actions"><button type="button" class="pr-cancel cursor-interaction" data-cancel autofocus>取消</button></div>`;
        } else {
          dialog.innerHTML = `<h2 id="pr-dialog-title">${draft ? '刪除這張收據？' : '作廢這筆帳目？'}</h2><p class="pr-dialog-merchant">${receipt.merchant} · <span class="pr-num">${money(total(receipt))}</span></p><p class="pr-dialog-effect">${draft ? `這張未入帳收據將刪除，無法從此介面復原。帳本支出維持 ${money(activeTotal())}。` : `保留歷史紀錄，這筆金額不再計入支出。目前支出將從 ${money(activeTotal())} 改為 ${money(activeTotal() - total(receipt))}。`}</p>${draft ? '' : `<label class="pr-reason" for="pr-void-reason">作廢原因<select id="pr-void-reason" class="cursor-interaction">${reasons.map(reason => `<option value="${reason}">${reason}</option>`).join('')}</select></label>`}<div class="pr-dialog-actions"><button type="button" class="pr-cancel cursor-interaction" data-cancel>取消</button><button type="button" class="pr-danger-button cursor-interaction" data-confirm>${action}</button></div>`;
        }
        refreshIcons();
      }
      function closeDialog(returnFocus = true) {
        dialog.close();
        modalMode = null;
        modalReceiptId = null;
        if (returnFocus && modalTrigger?.isConnected) modalTrigger.focus();
        modalTrigger = null;
      }
      root.addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button || !root.contains(button)) return;
        if (button.hasAttribute('data-cancel')) { closeDialog(); return; }
        if (button.hasAttribute('data-destructive')) {
          modalMode = 'confirm'; renderDialog(); dialog.querySelector('[data-cancel]').focus(); return;
        }
        if (button.hasAttribute('data-confirm')) {
          const receipt = receiptById[modalReceiptId];
          const draft = state.statuses[receipt.id] === 'draft';
          if (!draft) state.reasons[receipt.id] = dialog.querySelector('#pr-void-reason').value;
          state.statuses[receipt.id] = draft ? 'deleted' : 'voided';
          if (draft) state.tab = 'inbox';
          state.detailId = null;
          feedback = draft ? `${receipt.merchant}收據已刪除，帳本支出維持 ${money(activeTotal())}。` : `${receipt.merchant}帳目已作廢，目前支出 ${money(activeTotal())}。`;
          closeDialog(false); render(); persist(); root.querySelector(`[data-nav="${state.tab}"]`).focus(); return;
        }
        if (button.dataset.menu) { openMenu(button.dataset.menu, button); return; }
        feedback = '';
        if (button.dataset.nav) { state.tab = button.dataset.nav; state.detailId = null; }
        else if (button.dataset.open) { state.detailId = button.dataset.open; }
        else if (button.hasAttribute('data-back')) { state.detailId = null; }
        else if (button.dataset.post) {
          const receipt = receiptById[button.dataset.post];
          state.statuses[receipt.id] = 'confirmed'; state.detailId = null; state.tab = 'ledger';
          feedback = `${receipt.merchant}已入帳，目前支出 ${money(activeTotal())}。`;
        } else return;
        render(); persist();
        if (!button.isConnected) {
          const target = screen.querySelector('[data-back]') || root.querySelector(`[data-nav="${state.tab}"]`);
          target?.focus();
        }
      });
      root.addEventListener('change', event => {
        if (event.target.id === 'pr-show-voided') { state.showVoided = event.target.checked; feedback = ''; render(); persist(); screen.querySelector('#pr-show-voided').focus(); }
      });
      dialog.addEventListener('cancel', event => { event.preventDefault(); closeDialog(); });
      window.addEventListener('openai:set_globals', event => {
        if (!Object.prototype.hasOwnProperty.call(event.detail?.globals || {}, 'widgetState')) return;
        const next = restore(event.detail.globals.widgetState);
        const equal = next.version === state.version && next.tab === state.tab && next.detailId === state.detailId && next.showVoided === state.showVoided && receipts.every(({ id }) => next.statuses[id] === state.statuses[id] && next.reasons[id] === state.reasons[id]);
        if (equal) return;
        if (dialog.open) closeDialog(false);
        state = next; feedback = ''; render();
      });
      render();
    })();
  </script>
</div>
</main>
</body>
</html>
